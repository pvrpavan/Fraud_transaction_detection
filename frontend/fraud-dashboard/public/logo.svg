<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#C084FC"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="3" opacity="0.95"/>
  
  <!-- Shield body -->
  <path d="M256 72 L400 140 L400 280 C400 360 340 420 256 452 C172 420 112 360 112 280 L112 140 Z" 
        fill="url(#shieldGrad)" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Shield inner -->
  <path d="M256 100 L376 158 L376 274 C376 342 324 394 256 422 C188 394 136 342 136 274 L136 158 Z" 
        fill="#1E1B4B" opacity="0.85"/>
  
  <!-- Scan line effect (horizontal) -->
  <line x1="170" y1="240" x2="342" y2="240" stroke="url(#scanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Checkmark / detection symbol -->
  <path d="M200 260 L240 300 L320 200" 
        stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  
  <!-- Radar/pulse circles -->
  <circle cx="256" cy="250" r="60" stroke="url(#innerGrad)" stroke-width="1.5" fill="none" opacity="0.3"/>
  <circle cx="256" cy="250" r="90" stroke="url(#innerGrad)" stroke-width="1" fill="none" opacity="0.2"/>
  <circle cx="256" cy="250" r="120" stroke="url(#innerGrad)" stroke-width="0.8" fill="none" opacity="0.1"/>
  
  <!-- Small dots representing data points -->
  <circle cx="210" cy="190" r="4" fill="#818CF8" opacity="0.6"/>
  <circle cx="310" cy="180" r="3" fill="#818CF8" opacity="0.5"/>
  <circle cx="180" cy="300" r="3.5" fill="#F87171" opacity="0.6"/>
  <circle cx="330" cy="310" r="3" fill="#34D399" opacity="0.5"/>
  <circle cx="280" cy="340" r="4" fill="#34D399" opacity="0.4"/>
  <circle cx="195" cy="230" r="3" fill="#FBBF24" opacity="0.5"/>
</svg>
